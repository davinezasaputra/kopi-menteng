name: Repair White Screen Build

on:
  push:
    branches: [feat/erp-phase-5-finance-closing]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: repair white screen build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/erp-phase-5-finance-closing

      - name: Apply deterministic source fixes
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()

          def replace(path, old, new):
              p = root / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'pos-menteng-frontend/src/App.tsx',
              "import PurchaseOrders from './pages/PurchaseOrders';\n",
              '',
          )

          app = root / 'pos-menteng-frontend/src/App.tsx'
          text = app.read_text(encoding='utf-8')
          marker = "    <Route path=\"/purchasing/orders\" element={<ProtectedRoute requiredPermission=\"purchasing.order.view\"><PurchasingWorkspaceV2 /></ProtectedRoute>} />\n"
          fallback = "    <Route path=\"*\" element={<Navigate to=\"/dashboard\" replace />} />\n"
          if fallback not in text:
              if marker not in text:
                  raise SystemExit('App.tsx route marker not found')
              text = text.replace(marker, marker + fallback, 1)
              app.write_text(text, encoding='utf-8')

          replace(
              'pos-menteng-frontend/src/pages/EnterpriseOperations.tsx',
              "import { extractRows, extractData } from '../core/api/normalize';",
              "import { extractRows } from '../core/api/normalize';",
          )
          replace(
              'pos-menteng-frontend/src/pages/EnterpriseOperations.tsx',
              "form?: 'supplier' | 'requisition' | 'purchase-order' | 'goods-receipt' | 'supplier-invoice' | 'supplier-payment' | 'supplier-return' | 'credit-note' | 'budget' | 'purchasing-approval' | 'sales-order' | 'sales-approval' | 'fulfillment' | 'shipment' | 'sales-invoice' | 'customer-payment' | 'sales-return' | 'fiscal-period' | 'reconciliation' | 'erp-account' | 'erp-journal';",
              "form?: 'supplier' | 'requisition' | 'purchase-order' | 'goods-receipt' | 'supplier-invoice' | 'supplier-payment' | 'supplier-return' | 'credit-note' | 'budget' | 'purchasing-approval' | 'sales-order' | 'sales-approval' | 'fulfillment' | 'shipment' | 'sales-invoice' | 'customer-payment' | 'sales-return' | 'fiscal-period' | 'cash-book' | 'reconciliation' | 'erp-account' | 'erp-journal';",
          )
          replace(
              'pos-menteng-frontend/src/pages/EnterpriseOperations.tsx',
              "  const [orders, setOrders] = useState<Row[]>([]);\n",
              '',
          )

          guided = root / 'pos-menteng-frontend/src/pages/GuidedOperations.tsx'
          text = guided.read_text(encoding='utf-8')
          text = text.replace("import { can, canAny } from '../core/auth/permissions';", "import { can } from '../core/auth/permissions';", 1)
          old = "  const [poOptions, setPoOptions] = useState<Option[]>([]);\n  const [invoiceOptions, setInvoiceOptions] = useState<Option[]>([]);\n"
          if old not in text:
              raise SystemExit('GuidedOperations unused option states not found')
          text = text.replace(old, '', 1)
          old = "        const [supplierRes, customerRes, productRes, accountRes, orderRes, invoiceRes] = await Promise.all([\n          api.get('/purchasing/suppliers'),\n          api.get('/customers'),\n          api.get('/products'),\n          api.get('/erp/accounting/accounts'),\n          api.get('/purchasing/orders'),\n          api.get('/purchasing/invoices'),\n        ]);"
          new = "        const [supplierRes, customerRes, productRes, accountRes, warehouseRes] = await Promise.all([\n          api.get('/purchasing/suppliers'),\n          api.get('/customers'),\n          api.get('/products'),\n          api.get('/erp/accounting/accounts'),\n          api.get('/warehouses'),\n        ]);"
          if old not in text:
              raise SystemExit('GuidedOperations master request block not found')
          text = text.replace(old, new, 1)
          old = "        setAccounts(extractRows<Record<string, unknown>>(accountRes.data).map(row => ({ id: String(row.id ?? ''), label: `${String(row.code ?? '')} · ${String(row.name ?? '')}`, meta: String(row.type ?? '') })));\n        setPoOptions(extractRows<Record<string, unknown>>(orderRes.data).map(row => ({ id: String(row.id ?? ''), label: String(row.order_number ?? row.number ?? `PO #${row.id ?? ''}`), meta: String(row.status ?? '') })));\n        setInvoiceOptions(extractRows<Record<string, unknown>>(invoiceRes.data).map(row => ({ id: String(row.id ?? ''), label: String(row.invoice_number ?? `Invoice #${row.id ?? ''}`), meta: String(row.status ?? '') })));"
          new = "        setAccounts(extractRows<Record<string, unknown>>(accountRes.data).map(row => ({ id: String(row.id ?? ''), label: `${String(row.code ?? '')} · ${String(row.name ?? '')}`, meta: String(row.type ?? '') })));\n        setWarehouses(extractRows<Record<string, unknown>>(warehouseRes.data).map(row => ({ id: String(row.id ?? ''), label: String(row.name ?? row.code ?? row.id ?? ''), meta: row.code ? String(row.code) : undefined })));"
          if old not in text:
              raise SystemExit('GuidedOperations master assignment block not found')
          text = text.replace(old, new, 1)
          guided.write_text(text, encoding='utf-8')

          replace(
              'pos-menteng-frontend/src/pages/PurchasingWorkspace.tsx',
              "function getProductPrice(row: Row): number {\n  return num(row.purchase_price ?? row.cost ?? row.price ?? 0);\n}\n\n",
              '',
          )

          replace(
              'pos-menteng-frontend/src/pages/PurchasingWorkspaceV2.tsx',
              "masters.warehouse_id",
              "masters.warehouses",
          )
          replace(
              'pos-menteng-frontend/src/pages/PurchasingWorkspaceV2.tsx',
              "str(row.created_at??row.document_date??row.order_date??row.date).slice(0,10)||'—'",
              "str(row.order_date??row.document_date??row.created_at??row.date).slice(0,10)||'—'",
          )

          replace(
              '.github/workflows/erp-foundation.yml',
              "php-version: '8.3'",
              "php-version: '8.4'",
          )

          # Avoid a repository containing a workflow that can rewrite itself forever.
          repair = root / '.github/workflows/repair-white-screen.yml'
          if repair.exists():
              repair.unlink()
      - name: Verify frontend build and lint
        working-directory: pos-menteng-frontend
        run: |
          npm ci
          npm run build
          npm run lint

      - name: Commit verified repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes detected."
            exit 0
          fi
          git add pos-menteng-frontend .github/workflows/erp-foundation.yml
          git commit -m "chore: repair white screen build"
          git push origin HEAD:feat/erp-phase-5-finance-closing
