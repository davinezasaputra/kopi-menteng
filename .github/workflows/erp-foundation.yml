name: ERP Foundation Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-menteng-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cat > .env <<'EOF'
          APP_NAME="Kopi Menteng ERP"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_LEVEL=debug

          DB_CONNECTION=sqlite
          DB_DATABASE=database/database.sqlite

          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          FILESYSTEM_DISK=local
          EOF
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run full test suite
        run: php artisan test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-menteng-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pos-menteng-frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint
